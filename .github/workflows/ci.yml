name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - name: Unit tests
        run: python -m pytest -q
      - name: ShellCheck
        run: shellcheck iclaude install.sh uninstall.sh scripts/update.sh runtime/bin/iclaude-container
      - name: Compose config
        run: docker compose config --quiet

  image:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t iclaude:local .
      - name: Unit and bridge contract tests inside the image
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src --entrypoint sh iclaude:local -c \
            '/opt/inkbox-claude/bin/pip install -q --target /tmp/pt pytest && PYTHONPATH=/tmp/pt /opt/inkbox-claude/bin/python -m pytest -q -p no:cacheprovider'
      - name: Image contents
        run: |
          docker run --rm --entrypoint sh iclaude:local -c '
            set -e
            test "$(id -u)" = 1000
            claude --version
            gh --version
            git --version
            inkbox-claude --help > /dev/null
            test -f /opt/iclaude/defaults/CLAUDE.md'
      - name: Container waits for setup instead of starting the bridge
        run: |
          docker compose up -d --no-build
          for _ in $(seq 1 30); do
            docker compose logs iclaude | grep -q "waiting for setup" && break
            sleep 2
          done
          docker compose logs iclaude
          docker compose logs iclaude | grep -q "Claude login: not logged in"
          docker compose exec -T iclaude test -f /home/iclaude/.claude/CLAUDE.md
          if docker compose exec -T iclaude iclaude-container check; then echo "preflight must fail before setup"; exit 1; fi
          if docker compose exec -T iclaude touch /etc/should-fail; then echo "root filesystem must be read-only"; exit 1; fi
      - name: Allowlist persists across container recreation
        run: |
          docker compose exec -T iclaude iclaude-container allow +15551234567
          docker compose down
          docker compose up -d --no-build
          docker compose exec -T iclaude iclaude-container check authorised
      - name: Email alerts only go to an authorised phone
        run: |
          if docker compose exec -T iclaude iclaude-container alerts on --to +15550000000; then exit 1; fi
          docker compose exec -T iclaude iclaude-container alerts on
          docker compose exec -T iclaude iclaude-container alerts | grep -q "Notifications go to: +15551234567"
          docker compose exec -T iclaude iclaude-container alerts off
          docker compose exec -T iclaude iclaude-container briefing on --at 07:30
          docker compose exec -T iclaude iclaude-container briefing test | grep -q "Good morning"
          docker compose exec -T iclaude iclaude-container reminders | grep -q "No reminders"
          docker compose exec -T iclaude iclaude-container voice | grep -q "Inkbox speech-to-text"
      - name: Backup contains the config and restores it
        run: |
          ./iclaude backup "$RUNNER_TEMP/b.tgz" --with-workspace
          test "$(stat -c %a "$RUNNER_TEMP/b.tgz")" = 600
          tar -tzf "$RUNNER_TEMP/b.tgz" > "$RUNNER_TEMP/b.list"
          grep -qx "home/iclaude/.inkbox-claude/.env" "$RUNNER_TEMP/b.list"
          docker compose exec -T iclaude iclaude-container allow --replace +15559998888
          printf 'restore\n' | script -qec "./iclaude restore $RUNNER_TEMP/b.tgz" /dev/null
          docker compose exec -T iclaude iclaude-container allow | grep -q "+15551234567"
      - name: Factory reset keeps logins and config
        run: |
          docker compose exec -T iclaude sh -c 'mkdir -p ~/.claude/projects/-workspace /workspace/repo && echo {} > ~/.claude/.credentials.json && echo {} > ~/.inkbox-claude/sessions.json && echo x > /workspace/repo/f'
          ./iclaude reset --yes
          docker compose exec -T iclaude iclaude-container check authorised
          docker compose exec -T iclaude sh -c 'test -f ~/.claude/.credentials.json && test ! -e ~/.claude/projects && test ! -e ~/.inkbox-claude/sessions.json && test -z "$(ls -A /workspace)"'
          docker compose down -v
      - name: Installer (non-interactive)
        run: |
          git checkout -b ci-install
          ICLAUDE_REPO="$PWD" ICLAUDE_REF=ci-install ICLAUDE_DIR="$RUNNER_TEMP/iclaude" bash install.sh --no-setup
          "$RUNNER_TEMP/iclaude/iclaude" status
      - name: Update, auto-update and uninstall
        run: |
          ic="$RUNNER_TEMP/iclaude/iclaude"
          "$ic" update --auto | tee update.log
          grep -q "up to date" update.log
          if command -v crontab >/dev/null; then
            "$ic" auto-update on
            crontab -l | grep -q iclaude-auto-update
            "$ic" auto-update off
            if crontab -l 2>/dev/null | grep -q iclaude-auto-update; then exit 1; fi
          fi
          "$ic" uninstall --yes
          test ! -e "$RUNNER_TEMP/iclaude"
          test ! -e "$HOME/.local/bin/iclaude"
          docker volume inspect iclaude_home iclaude_workspace > /dev/null
          docker volume rm iclaude_home iclaude_workspace
